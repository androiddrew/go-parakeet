name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_VERSION: 1.22.0
  ORT_SHA256: 8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3
  PARAKEET_RELEASE: https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"] # declared minimum and latest
    env:
      PARAKEET_TEST_PRECISION: int8 # the FP32 encoder weights are 2.4 GB
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          echo "${ORT_SHA256}  ort.tgz" | sha256sum -c -
          tar -xzf ort.tgz -C "$RUNNER_TEMP"
          echo "PARAKEET_TEST_ORT=$RUNNER_TEMP/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" >> "$GITHUB_ENV"
      - name: Cache Parakeet INT8 model
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/parakeet-assets
          key: parakeet-int8-${{ hashFiles('SHA256SUMS') }}
      - name: Download Parakeet INT8 model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/parakeet-assets/parakeet
          for f in nemo128.onnx encoder-model.int8.onnx decoder_joint-model.int8.onnx; do
            curl -fsSL -o ~/parakeet-assets/parakeet/$f "$PARAKEET_RELEASE/$f"
          done
      - name: Verify Parakeet files
        run: |
          (cd ~/parakeet-assets && sha256sum -c --ignore-missing "$GITHUB_WORKSPACE/SHA256SUMS")
          test "$(cd ~/parakeet-assets && sha256sum -c --ignore-missing "$GITHUB_WORKSPACE/SHA256SUMS" | wc -l)" -eq 3
          echo "PARAKEET_TEST_ASSETS=$HOME/parakeet-assets/parakeet" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race -timeout=30m ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # staticcheck 2026.2.1 cannot read Go 1.27 export data
          # (dominikh/go-tools#1832); return to stable once a release supports it.
          go-version: "1.26.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
